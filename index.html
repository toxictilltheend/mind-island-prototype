<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef1e9"><title>心屿 · 情绪日记与自我关怀</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ee;color:#3f5543;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.8}main{max-width:960px;margin:0 auto;padding:50px 26px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfe5d7;padding-bottom:20px}.logo{font-size:25px;letter-spacing:4px}.badge{font-size:11px;background:#e8eddf;padding:5px 11px;border-radius:20px}.hero{margin:65px 0 40px}small{font-size:10px;letter-spacing:3px;color:#91a07e}h1{font-size:clamp(30px,6vw,47px);font-weight:500;line-height:1.5;letter-spacing:2px;margin:18px 0}p{font-size:14px;color:#8b957f}.moods{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}button{font:inherit;color:#607656;cursor:pointer;border:1px solid #d8e0cc;border-radius:13px;background:#fffef9;padding:13px 19px;font-size:13px}button.selected{background:#dce7ce;border-color:#879f71}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fffef9;border:1px solid #e2e7d8;border-radius:20px;padding:26px}h2{font-size:17px;font-weight:500}.number{font:30px Georgia,serif;color:#bbc8aa}.card p{font-size:12px}footer{font-size:11px;color:#9ba58e;margin-top:45px;border-top:1px solid #e1e6d8;padding-top:20px}#response{min-height:28px;font-size:12px;color:#6e855e;margin-top:15px}@media(max-width:600px){.cards{grid-template-columns:1fr}.hero{margin-top:40px}.card{padding:20px}main{padding-top:28px}}</style></head><body><main><header><span class="logo">✧ 心屿</span><span class="badge">公开交互原型 · V0.1</span></header><section class="hero"><small>A LITTLE SPACE FOR YOURSELF</small><h1>每一种情绪，<br>都有被看见的意义。</h1><p>在这里，记录当下的感受，用一个小行动照顾自己。</p><div class="moods" aria-label="此刻的心情"><button>低落</button><button>有点累</button><button>平静</button><button>还不错</button><button>很开心</button></div><p id="response" role="status">先选一个此刻的感受吧。</p></section><div class="cards"><article class="card"><span class="number">01</span><h2>记录此刻</h2><p>用心情、情境和一句话，为今天留一个位置。</p></article><article class="card"><span class="number">02</span><h2>看见变化</h2><p>回看情绪的起伏，留意反复出现的生活情境。</p></article><article class="card"><span class="number">03</span><h2>温柔关怀</h2><p>呼吸、舒缓声景与轻活动，找到适合自己的小行动。</p></article></div><footer>首版框架已上线，完整日记与练习交互正在补充。此页面不收集个人数据，不提供心理诊断或治疗。</footer></main><script>document.querySelectorAll('.moods button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.moods button').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');document.getElementById('response').textContent='此刻的「'+b.textContent+'」被看见了。慢慢来，也没关系。';}));</script></body></html>
